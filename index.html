<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

  /* Home Screen */
  .home { padding: 20px; overflow-y: auto; height: 100%; }
  .home h1 { font-size: 32px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
  .home .subtitle { color: #888; margin-bottom: 24px; font-size: 15px; }
  .circuit-card {
    background: #1c1c1e;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .circuit-card:active { transform: scale(0.98); }
  .circuit-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .circuit-card .meta { color: #888; font-size: 13px; margin-bottom: 8px; }
  .circuit-card .description { color: #ccc; font-size: 14px; line-height: 1.4; }
  .difficulty {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .diff-beginner { background: #30d158; color: #000; }
  .diff-intermediate { background: #ff9f0a; color: #000; }
  .diff-advanced { background: #ff453a; color: #fff; }

  /* Preview Screen */
  .preview {
    padding: 20px;
    overflow-y: auto;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .back-btn {
    background: none;
    color: #0a84ff;
    border: none;
    font-size: 17px;
    padding: 0;
    margin-bottom: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .preview h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: -0.5px; }
  .preview .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    color: #888;
    font-size: 14px;
  }
  .preview .description {
    background: #1c1c1e;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    line-height: 1.5;
    font-size: 15px;
  }
  .exercise-list {
    margin-bottom: 20px;
    flex: 1;
  }
  .exercise-list h3 {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .exercise-item {
    background: #1c1c1e;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
  }
  .exercise-item .duration {
    color: #888;
    font-size: 13px;
  }
  .start-btn {
    background: #0a84ff;
    color: white;
    border: none;
    padding: 18px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .start-btn:active { opacity: 0.8; }

  /* Workout Screen */
  .workout {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px;
    text-align: center;
  }
  .workout-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .workout-header .quit-btn {

  }

    border-radius: 2px;
    margin-bottom: 30px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #0a84ff;
    transition: width 0.3s;
  }
  .exercise-name {
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .exercise-type {
    color: #888;
    font-size: 16px;
    margin-bottom: 40px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .timer-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .timer-circle {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: #1c1c1e;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 30px;
  }
  .timer-circle svg {
    position: absolute;
    top: 0;
    left: 0;
    transform: rotate(-90deg);
  }
  .timer-text {
    font-size: 82px;
    font-weight: 700;

    letter-spacing: -3px;
    z-index: 1;
  }

  .timer-text.work { color: #fff; }
  .timer-text.warmup { color: #ff9f0a; }
  .next-up {
    color: #888;
    font-size: 15px;
    margin-bottom: 20px;
  }
  .next-up span { color: #fff; font-weight: 600; }

    flex: 1;
    background: #1c1c1e;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;

    .timer-text { font-size: 48px; }

    50% { transform: scale(1.1); }
  }

// ============================================================
// AUDIO CUES
// ============================================================

let audioContext = null;

function playBeep(frequency = 800, duration = 0.15, volume = 0.3) {
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.frequency.value = frequency;
    oscillator.type = 'sine';
    gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + duration);
  } catch (e) {
    console.log('Audio not available');
  }
}

function playCountdownBeep() { playBeep(800, 0.1, 0.3); }
function playStartBeep() { playBeep(1000, 0.3, 0.4); }
function playRestBeep() { playBeep(500, 0.2, 0.3); }
function playCompleteBeep() {
  playBeep(600, 0.15, 0.4);
  setTimeout(() => playBeep(800, 0.15, 0.4), 150);
  setTimeout(() => playBeep(1000, 0.4, 0.4), 300);
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ============================================================
// WAKE LOCK (Keep screen on)
// ============================================================

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      state.wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {
    console.log('Wake lock not available');
  }
}

function releaseWakeLock() {
  if (state.wakeLock) {
    state.wakeLock.release().catch(() => {});
    state.wakeLock = null;
  }
}

document.addEventListener('visibilitychange', async () => {
  if (state.wakeLock !== null && document.visibilityState === 'visible' && state.screen === 'workout') {
    await requestWakeLock();
  }
});

          <div class="meta">
            <span class="difficulty diff-${c.difficulty}">${c.difficulty}</span>
            ${c.duration} min • ${c.rounds} ${c.rounds === 1 ? 'round' : 'rounds'}
          </div>
          <div class="description">${c.description}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function selectCircuit(id) {
  state.circuit = CIRCUITS.find(c => c.id === id);
  state.screen = 'preview';
  renderPreview();
}

function renderPreview() {
  const c = state.circuit;
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="preview">
      <button class="back-btn" onclick="goHome()">‹ Back</button>
      <h1>${c.name}</h1>
      <div class="stats">
        <span>⏱ ${c.duration} min</span>
        <span>🔁 ${c.rounds} ${c.rounds === 1 ? 'round' : 'rounds'}</span>
        <span>💪 ${c.difficulty}</span>
      </div>
      <div class="description">${c.description}</div>
      <div class="exercise-list">
        <h3>Round Structure</h3>
        ${c.exercises.map(ex => `
          <div class="exercise-item">
            <div>
              <div>${ex.name}${ex.detail ? ` <span style="color:#888;font-size:13px">• ${ex.detail}</span>` : ''}</div>
            </div>
            <div class="duration">${ex.duration}s</div>
          </div>
        `).join('')}
      </div>
      <button class="start-btn" onclick="startWorkout()">Start Workout</button>
    </div>
  `;
}

function goHome() {
  stopTimer();
  releaseWakeLock();
  state.screen = 'home';
  state.circuit = null;
  renderHome();
}

// ============================================================
// WORKOUT
// ============================================================

function startWorkout() {
  // Prime audio context (needs user interaction)
  playBeep(1, 0.01, 0);

  requestWakeLock();

  const c = state.circuit;
  state.exercises = [];

  // Add warmup
  if (c.warmup) {
    state.exercises.push({ ...c.warmup, round: 0, isWarmup: true });
  }

  // Build full exercise list with all rounds
  for (let r = 1; r <= c.rounds; r++) {
    c.exercises.forEach(ex => {
      state.exercises.push({ ...ex, round: r });
    });
  }

  state.currentExerciseIndex = 0;
  state.currentRound = 1;
  state.timeRemaining = state.exercises[0].duration;
  state.totalTimeRemaining = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);
  state.isPaused = false;
  state.workoutStartTime = Date.now();
  state.screen = 'workout';

  renderWorkout();
  startTimer();
  playStartBeep();
}

function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (state.isPaused) return;
    state.timeRemaining--;
    state.totalTimeRemaining--;

    // Audio cues for last 3 seconds
    if (state.timeRemaining <= 3 && state.timeRemaining > 0) {
      playCountdownBeep();
    }

    if (state.timeRemaining <= 0) {
      nextExercise();
    } else {
      updateTimerDisplay();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function nextExercise() {
  state.currentExerciseIndex++;

  if (state.currentExerciseIndex >= state.exercises.length) {
    completeWorkout();
    return;
  }

  const nextEx = state.exercises[state.currentExerciseIndex];
  state.currentRound = nextEx.round || state.currentRound;
  state.timeRemaining = nextEx.duration;

  // Different sounds for work vs rest
  if (nextEx.type === 'rest') {
    playRestBeep();
    vibrate([100, 50, 100]);
  } else {
    playStartBeep();
    vibrate([200]);
  }

  renderWorkout();
}

function togglePause() {
  state.isPaused = !state.isPaused;
  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.textContent = state.isPaused ? 'Resume' : 'Pause';
}

function skipExercise() {
  nextExercise();
}

function quitWorkout() {
  if (confirm('End workout?')) {
    stopTimer();
    releaseWakeLock();
    goHome();
  }
}

function renderWorkout() {
  const currentEx = state.exercises[state.currentExerciseIndex];
  const nextEx = state.exercises[state.currentExerciseIndex + 1];
  const c = state.circuit;

  // Calculate progress
  const totalDuration = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);
  const progress = ((totalDuration - state.totalTimeRemaining) / totalDuration) * 100;

  const roundText = currentEx.isWarmup
    ? 'Warm-Up'
    : `Round ${state.currentRound} of ${c.rounds}`;

  const timerClass = currentEx.type === 'rest' ? 'rest'
    : currentEx.type === 'warmup' ? 'warmup'
    : 'work';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="workout">
      <div class="workout-header">
        <div class="round-info">${roundText}</div>
        <button class="quit-btn" onclick="quitWorkout()">End</button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${progress}%"></div>
      </div>
      <div class="exercise-name">${currentEx.name}</div>
      <div class="exercise-type">${currentEx.detail || currentEx.type}</div>
      <div class="timer-container">
        <div class="timer-circle">
          <div class="timer-text ${timerClass}" id="timerText">${formatTime(state.timeRemaining)}</div>
        </div>
        ${nextEx ? `<div class="next-up">Next: <span>${nextEx.name}</span></div>` : ''}
      </div>
      <div class="workout-controls">
        <button class="control-btn" id="pauseBtn" onclick="togglePause()">${state.isPaused ? 'Resume' : 'Pause'}</button>
        <button class="control-btn primary" onclick="skipExercise()">Skip</button>
      </div>
    </div>
  `;
}

function updateTimerDisplay() {
  const timerText = document.getElementById('timerText');
  if (timerText) {
    timerText.textContent = formatTime(state.timeRemaining);
    if (state.timeRemaining <= 3 && state.timeRemaining > 0) {
      timerText.classList.add('pulse');
    } else {
      timerText.classList.remove('pulse');
    }
  }
  // Update progress bar
  const totalDuration = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);
  const progress = ((totalDuration - state.totalTimeRemaining) / totalDuration) * 100;
  const progressFill = document.querySelector('.progress-fill');
  if (progressFill) progressFill.style.width = progress + '%';
}

function formatTime(seconds) {
  if (seconds >= 60) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }
  return seconds.toString();
}

function completeWorkout() {
  stopTimer();
  releaseWakeLock();
  playCompleteBeep();
  vibrate([200, 100, 200, 100, 200]);

  const duration = Math.round((Date.now() - state.workoutStartTime) / 1000);
  const minutes = Math.floor(duration / 60);
  const seconds = duration % 60;

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="complete">
      <div class="celebration">🎉</div>
      <h1>Workout Complete!</h1>
      <div class="subtitle">${state.circuit.name}</div>
      <div class="complete-stats">
        <div class="stat-row">
          <span class="label">Duration</span>
          <span class="value">${minutes}:${seconds.toString().padStart(2, '0')}</span>
        </div>
        <div class="stat-row">
          <span class="label">Rounds</span>
          <span class="value">${state.circuit.rounds} / ${state.circuit.rounds}</span>
        </div>
        <div class="stat-row">
          <span class="label">Difficulty</span>
          <span class="value" style="text-transform:capitalize">${state.circuit.difficulty}</span>
        </div>
      </div>
      <button class="done-btn" onclick="goHome()">Done</button>
    </div>
  `;
  state.screen = 'complete';
}

// ============================================================
// INIT
// ============================================================

renderHome();

// Prevent accidental page leave during workout
window.addEventListener('beforeunload', (e) => {
  if (state.screen === 'workout') {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
</html>
