<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Circuit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

  /* Home Screen */
  .home { padding: 20px; overflow-y: auto; height: 100%; }
  .home h1 { font-size: 32px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
  .home .subtitle { color: #888; margin-bottom: 24px; font-size: 15px; }
  .circuit-card {
    background: #1c1c1e;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .circuit-card:active { transform: scale(0.98); }
  .circuit-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .circuit-card .meta { color: #888; font-size: 13px; margin-bottom: 8px; }
  .circuit-card .description { color: #ccc; font-size: 14px; line-height: 1.4; }
  .difficulty {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .diff-beginner { background: #30d158; color: #000; }
  .diff-intermediate { background: #ff9f0a; color: #000; }
  .diff-advanced { background: #ff453a; color: #fff; }

  /* Preview Screen */
  .preview {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .preview-header {
    padding: 20px 20px 0 20px;
    background: #000;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .back-btn {
    background: none;
    color: #0a84ff;
    border: none;
    font-size: 17px;
    padding: 0;
    margin-bottom: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .preview h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: -0.5px; }
  .preview .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    color: #888;
    font-size: 14px;
  }
  .start-btn-top {
    background: #0a84ff;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-bottom: 20px;
  }
  .start-btn-top:active { opacity: 0.8; }
  .preview-body {
    padding: 0 20px 20px 20px;
    overflow-y: auto;
    flex: 1;
  }
  .preview .description {
    background: #1c1c1e;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    line-height: 1.5;
    font-size: 15px;
  }
  .exercise-list h3 {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .exercise-item {
    background: #1c1c1e;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    gap: 12px;
  }
  .exercise-item-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    background: #2c2c2e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .exercise-item-content {
    flex: 1;
    min-width: 0;
  }
  .exercise-item-name {
    font-size: 15px;
  }
  .exercise-item .duration {
    color: #888;
    font-size: 13px;
    flex-shrink: 0;
  }

  /* Workout Screen */
  .workout {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 20px;
    text-align: center;
  }
  .workout-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .workout-header .round-info {
    color: #888;
    font-size: 14px;
  }
  .workout-header .quit-btn {
    background: none;
    color: #ff453a;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  .progress-bar {
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #0a84ff;
    transition: width 0.3s;
  }
  .exercise-name {
    font-size: 36px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .exercise-type {
    color: #888;
    font-size: 14px;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .exercise-illustration {
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1c1e;
    border-radius: 20px;
  }
  .exercise-illustration svg {
    width: 100px;
    height: 100px;
  }
  .timer-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .timer-circle {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: #1c1c1e;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 20px;
  }
  .timer-text {
    font-size: 72px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -3px;
    z-index: 1;
  }
  .timer-text.rest { color: #30d158; }
  .timer-text.work { color: #fff; }
  .timer-text.warmup { color: #ff9f0a; }
  .next-up {
    color: #888;
    font-size: 15px;
    margin-bottom: 20px;
  }
  .next-up span { color: #fff; font-weight: 600; }
  .workout-controls {
    display: flex;
    gap: 12px;
  }
  .control-btn {
    flex: 1;
    background: #1c1c1e;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .control-btn.primary {
    background: #0a84ff;
  }
  .control-btn:active { opacity: 0.7; }

  /* Complete Screen */
  .complete {
    padding: 30px 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .complete .celebration {
    font-size: 64px;
    margin-bottom: 20px;
  }
  .complete h1 {
    font-size: 32px;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }
  .complete .subtitle {
    color: #888;
    margin-bottom: 30px;
    font-size: 16px;
  }
  .complete-stats {
    background: #1c1c1e;
    padding: 20px;
    border-radius: 16px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 30px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 16px;
  }
  .stat-row .label { color: #888; }
  .stat-row .value { font-weight: 600; }
  .done-btn {
    background: #0a84ff;
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 320px;
  }

  .hidden { display: none !important; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .timer-text.pulse {
    animation: pulse 0.5s ease-in-out infinite;
    color: #ff453a;
  }

  /* Small mini icon for exercise list */
  .mini-icon svg {
    width: 24px;
    height: 24px;
  }
</style>
</head>

function getIllustration(exerciseName) {
  const name = exerciseName.toLowerCase();
  if (name.includes('push-up') || name.includes('push up')) return ILLUSTRATIONS['push-ups'];
  if (name.includes('squat')) return ILLUSTRATIONS['squats'];
  if (name.includes('pull-up') || name.includes('pull up')) return ILLUSTRATIONS['pull-ups'];
  if (name.includes('jump rope') || name.includes('jumping')) {
    if (name.includes('jumping jack')) return ILLUSTRATIONS['jumping-jacks'];
    return ILLUSTRATIONS['jump-rope'];
  }
  if (name.includes('mountain climber')) return ILLUSTRATIONS['mountain-climbers'];
  if (name.includes('side plank')) return ILLUSTRATIONS['side-plank'];
  if (name.includes('plank')) return ILLUSTRATIONS['plank'];
  if (name.includes('lunge')) return ILLUSTRATIONS['lunges'];
  if (name.includes('sit-up') || name.includes('sit up')) return ILLUSTRATIONS['sit-ups'];
  if (name.includes('leg raise')) return ILLUSTRATIONS['leg-raises'];
  if (name.includes('bicycle') || name.includes('crunch')) return ILLUSTRATIONS['bicycle-crunches'];
  if (name.includes('high knee')) return ILLUSTRATIONS['high-knees'];
  if (name.includes('dip')) return ILLUSTRATIONS['dips'];
  if (name.includes('row')) return ILLUSTRATIONS['rows'];
  if (name.includes('hollow')) return ILLUSTRATIONS['hollow-hold'];
  if (name.includes('warm')) return ILLUSTRATIONS['warm-up'];
  if (name.includes('rest')) return ILLUSTRATIONS['rest'];
  return ILLUSTRATIONS['default'];
}

// APP STATE

let state = {
  screen: 'home',
  circuit: null,
  currentRound: 1,
  currentExerciseIndex: 0,
  timeRemaining: 0,
  totalTimeRemaining: 0,
  isPaused: false,

  workoutStartTime: null,
  exercises: [],
  wakeLock: null,

// ============================================================
// AUDIO CUES
// ============================================================

let audioContext = null;

function playBeep(frequency = 800, duration = 0.15, volume = 0.3) {
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.frequency.value = frequency;
    oscillator.type = 'sine';
    gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + duration);
  } catch (e) {
    console.log('Audio not available');
  }
}

function playCountdownBeep() { playBeep(800, 0.1, 0.3); }
function playStartBeep() { playBeep(1000, 0.3, 0.4); }
function playRestBeep() { playBeep(500, 0.2, 0.3); }
function playCompleteBeep() {
  playBeep(600, 0.15, 0.4);
  setTimeout(() => playBeep(800, 0.15, 0.4), 150);
  setTimeout(() => playBeep(1000, 0.4, 0.4), 300);
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ============================================================
// WAKE LOCK
// ============================================================

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      state.wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {
    console.log('Wake lock not available');
  }
}

function releaseWakeLock() {
  if (state.wakeLock) {
    state.wakeLock.release().catch(() => {});
    state.wakeLock = null;
  }
}

document.addEventListener('visibilitychange', async () => {
  if (state.wakeLock !== null && document.visibilityState === 'visible' && state.screen === 'workout') {
    await requestWakeLock();
  }
});

function goHome() {
  stopTimer();
  releaseWakeLock();

// ============================================================
// WORKOUT
// ============================================================

function startWorkout() {
  playBeep(1, 0.01, 0);
  requestWakeLock();

  const c = state.circuit;
  state.exercises = [];

  if (c.warmup) {
    state.exercises.push({ ...c.warmup, round: 0, isWarmup: true });
  }

  for (let r = 1; r <= c.rounds; r++) {
    c.exercises.forEach(ex => {
      state.exercises.push({ ...ex, round: r });
    });
  }

  state.currentExerciseIndex = 0;
  state.currentRound = 1;
  state.timeRemaining = state.exercises[0].duration;
  state.totalTimeRemaining = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);
  state.isPaused = false;
  state.workoutStartTime = Date.now();
  state.screen = 'workout';

  renderWorkout();
  startTimer();
  playStartBeep();
}

function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (state.isPaused) return;
    state.timeRemaining--;
    state.totalTimeRemaining--;

    if (state.timeRemaining <= 3 && state.timeRemaining > 0) {
      playCountdownBeep();
    }

    if (state.timeRemaining <= 0) {
      nextExercise();
    } else {
      updateTimerDisplay();
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function nextExercise() {
  state.currentExerciseIndex++;

  if (state.currentExerciseIndex >= state.exercises.length) {
    completeWorkout();
    return;
  }

  const nextEx = state.exercises[state.currentExerciseIndex];
  state.currentRound = nextEx.round || state.currentRound;
  state.timeRemaining = nextEx.duration;

  if (nextEx.type === 'rest') {
    playRestBeep();
    vibrate([100, 50, 100]);
  } else {
    playStartBeep();
    vibrate([200]);
  }

  renderWorkout();
}

function togglePause() {
  state.isPaused = !state.isPaused;
  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.textContent = state.isPaused ? 'Resume' : 'Pause';
}

function skipExercise() {
  nextExercise();
}

function quitWorkout() {
  if (confirm('End workout?')) {
    stopTimer();
    releaseWakeLock();
    goHome();
  }
}

function renderWorkout() {
  const currentEx = state.exercises[state.currentExerciseIndex];
  const nextEx = state.exercises[state.currentExerciseIndex + 1];
  const c = state.circuit;

  const totalDuration = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);
  const progress = ((totalDuration - state.totalTimeRemaining) / totalDuration) * 100;

  const roundText = currentEx.isWarmup
    ? 'Warm-Up'
    : `Round ${state.currentRound} of ${c.rounds}`;

  const timerClass = currentEx.type === 'rest' ? 'rest'
    : currentEx.type === 'warmup' ? 'warmup'
    : 'work';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="workout">
      <div class="workout-header">
        <div class="round-info">${roundText}</div>
        <button class="quit-btn" onclick="quitWorkout()">End</button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${progress}%"></div>
      </div>
      <div class="exercise-name">${currentEx.name}</div>
      <div class="exercise-type">${currentEx.detail || currentEx.type}</div>
      <div class="exercise-illustration">${getIllustration(currentEx.name)}</div>
      <div class="timer-container">
        <div class="timer-circle">
          <div class="timer-text ${timerClass}" id="timerText">${formatTime(state.timeRemaining)}</div>
        </div>
        ${nextEx ? `<div class="next-up">Next: <span>${nextEx.name}</span></div>` : ''}
      </div>
      <div class="workout-controls">
        <button class="control-btn" id="pauseBtn" onclick="togglePause()">${state.isPaused ? 'Resume' : 'Pause'}</button>
        <button class="control-btn primary" onclick="skipExercise()">Skip</button>
      </div>
    </div>
  `;
}

function updateTimerDisplay() {
  const timerText = document.getElementById('timerText');
  if (timerText) {
    timerText.textContent = formatTime(state.timeRemaining);
    if (state.timeRemaining <= 3 && state.timeRemaining > 0) {
      timerText.classList.add('pulse');
    } else {
      timerText.classList.remove('pulse');
    }
  }
  const totalDuration = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);
  const progress = ((totalDuration - state.totalTimeRemaining) / totalDuration) * 100;
  const progressFill = document.querySelector('.progress-fill');
  if (progressFill) progressFill.style.width = progress + '%';
}

function formatTime(seconds) {
  if (seconds >= 60) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }
  return seconds.toString();
}

function completeWorkout() {
  stopTimer();
  releaseWakeLock();
  playCompleteBeep();
  vibrate([200, 100, 200, 100, 200]);

  const duration = Math.round((Date.now() - state.workoutStartTime) / 1000);
  const minutes = Math.floor(duration / 60);
  const seconds = duration % 60;

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="complete">
      <div class="celebration">🎉</div>
      <h1>Workout Complete!</h1>
      <div class="subtitle">${state.circuit.name}</div>
      <div class="complete-stats">
        <div class="stat-row">
          <span class="label">Duration</span>
          <span class="value">${minutes}:${seconds.toString().padStart(2, '0')}</span>
        </div>
        <div class="stat-row">
          <span class="label">Rounds</span>
          <span class="value">${state.circuit.rounds} / ${state.circuit.rounds}</span>
        </div>
        <div class="stat-row">
          <span class="label">Difficulty</span>
          <span class="value" style="text-transform:capitalize">${state.circuit.difficulty}</span>
        </div>
      </div>
      <button class="done-btn" onclick="goHome()">Done</button>
    </div>
  `;
  state.screen = 'complete';
}

    e.preventDefault();

});
