<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Lock In</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

  /* Home Screen */
  .home { padding: 20px; overflow-y: auto; height: 100%; }
  .home-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .home h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; line-height: 1.15; flex: 1; margin-right: 12px; }
  .voice-toggle {
    background: #1c1c1e;
    border: none;
    color: #fff;
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .voice-toggle.off { color: #888; }
  .voice-toggle .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #30d158;
  }
  .voice-toggle.off .dot { background: #555; }
  .home .subtitle { color: #888; margin-bottom: 24px; font-size: 15px; }

  /* Filters */
  .filters-sticky {
    background: #000;
    padding: 8px 0 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid #1c1c1e;
  }
  .filter-label {
    color: #666;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin: 8px 0 6px;
  }
  .filter-label:first-child { margin-top: 0; }
  .filter-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 2px;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .pill {
    background: #1c1c1e;
    color: #ccc;
    border: none;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .pill:active { transform: scale(0.95); }
  .pill.active {
    background: #0a84ff;
    color: #fff;
  }
  .no-results {
    text-align: center;
    color: #666;
    padding: 40px 20px;
    font-size: 15px;
  }
  .circuit-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .circuit-card {
    background: #1c1c1e;
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
  }
  .circuit-card:active { transform: scale(0.98); }
  .circuit-card h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }
  .circuit-card .meta {
    color: #888;
    font-size: 12px;
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .circuit-card .meta-info {
    display: block;
    width: 100%;
    margin-top: 4px;
  }
  .circuit-card .description {
    color: #ccc;
    font-size: 13px;
    line-height: 1.4;
    flex: 1;
  }

  /* Split Card - tile size like other cards */
  .split-card {
    background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
    border: 1px solid #333;
  }
  .split-card:active { transform: scale(0.98); }
  .split-card h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
    line-height: 1.2;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .split-badge {
    display: inline-block;
    background: #0a84ff;
    color: #fff;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .split-card .meta {
    color: #888;
    font-size: 12px;
    margin-bottom: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .split-card .description {
    color: #ccc;
    font-size: 13px;
    line-height: 1.4;
    flex: 1;
  }

  /* Split Day Screen */
  .split-days {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .split-days-header {
    padding: 20px 20px 0 20px;
    background: #000;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .split-days-header h1 {
    font-size: 24px;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .split-days-header .why {
    background: #1c1c1e;
    padding: 14px;
    border-radius: 12px;
    color: #ccc;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .split-days-body {
    padding: 0 20px 20px 20px;
    overflow-y: auto;
    flex: 1;
  }
  .split-days-body h3 {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .day-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .day-card {
    background: #1c1c1e;
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
  }
  .day-card:active { transform: scale(0.98); }
  .day-card h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .day-card .meta {
    color: #888;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .day-card .description {
    color: #ccc;
    font-size: 13px;
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .day-card .why-mini {
    color: #999;
    font-size: 12px;
    line-height: 1.4;
    font-style: italic;
    flex: 1;
  }
  .difficulty {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .diff-beginner { background: #30d158; color: #000; }
  .diff-intermediate { background: #ff9f0a; color: #000; }
  .diff-advanced { background: #ff453a; color: #fff; }

  /* Preview Screen */
  .preview { height: 100%; display: flex; flex-direction: column; }
  .preview-header {
    padding: 20px 20px 0 20px;
    background: #000;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .back-btn {
    background: none;
    color: #0a84ff;
    border: none;
    font-size: 17px;
    padding: 0;
    margin-bottom: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .preview h1 { font-size: 28px; margin-bottom: 8px; letter-spacing: -0.5px; }
  .preview .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    color: #888;
    font-size: 14px;
  }
  .start-btn-top {
    background: #0a84ff;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-bottom: 20px;
  }
  .start-btn-top:active { opacity: 0.8; }
  .preview-body { padding: 0 20px 20px 20px; overflow-y: auto; flex: 1; }
  .preview .description {
    background: #1c1c1e;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    line-height: 1.5;
    font-size: 15px;
  }
  .how-to {
    background: #1c1c1e;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    border-left: 3px solid #0a84ff;
  }
  .how-to h3 {
    font-size: 12px;
    color: #0a84ff;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .how-to p {
    color: #ddd;
    font-size: 14px;
    line-height: 1.6;
  }
  .amrap-badge {
    display: inline-block;
    background: #ff453a;
    color: #fff;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .treadmill-badge {
    display: inline-block;
    background: #ff9f0a;
    color: #000;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-left: 4px;
  }
  .exercise-list h3 {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .exercise-item {
    background: #1c1c1e;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
  }
  .exercise-item .duration { color: #888; font-size: 13px; }

  /* Workout Screen */
  .workout { height: 100%; display: flex; flex-direction: column; padding: 20px; text-align: center; }
  .workout-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .workout-header .round-info { color: #888; font-size: 14px; }
  .workout-header .quit-btn {
    background: none;
    color: #ff453a;
    border: none;
    font-size: 15px;
    cursor: pointer;
  }
  .progress-bar {
    height: 4px;
    background: #333;
    border-radius: 2px;
    margin-bottom: 30px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: #0a84ff; transition: width 0.3s; }
  .exercise-name {
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .exercise-type {
    color: #888;
    font-size: 16px;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .amrap-hint {
    background: #ff453a;
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .timer-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .timer-circle {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: #1c1c1e;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 30px;
  }
  .timer-text {
    font-size: 82px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -3px;
    z-index: 1;
  }
  .timer-text.rest { color: #30d158; }
  .timer-text.work { color: #fff; }
  .timer-text.warmup { color: #ff9f0a; }
  .next-up { color: #888; font-size: 15px; margin-bottom: 20px; }
  .next-up span { color: #fff; font-weight: 600; }
  .workout-controls { display: flex; gap: 12px; }
  .control-btn {
    flex: 1;
    background: #1c1c1e;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .control-btn.primary { background: #0a84ff; }
  .control-btn.done-btn {
    background: #30d158;
    color: #000;
    font-weight: 700;
  }
  .control-btn.next-btn { background: #30d158; color: #000; }
  .control-btn:active { opacity: 0.7; }

  /* Continuous Round Workout Layout */
  .continuous-round .round-timer-block {
    text-align: center;
    background: #1c1c1e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .round-timer-label {
    color: #888;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .round-timer {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 1;
  }
  .round-timer.pulse {
    color: #ff453a;
    animation: pulse 0.5s ease-in-out infinite;
  }
  .round-exercise-list {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .round-exercise {
    background: #1c1c1e;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .round-ex-number {
    background: #0a84ff;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }
  .round-ex-content {
    flex: 1;
  }
  .round-ex-name {
    font-size: 16px;
    font-weight: 600;
    color: #ccc;
    line-height: 1.2;
  }
  .round-ex-detail {
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }

  /* Global timer strip (shown during rest for BW AMRAP) */
  .global-timer-strip {
    background: #1c1c1e;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 3px solid #0a84ff;
  }
  .global-timer-label {
    color: #888;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .global-timer-value {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #0a84ff;
    letter-spacing: -0.5px;
  }

  /* Rest Screen */
  .continuous-rest .rest-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .rest-label {
    font-size: 48px;
    font-weight: 800;
    color: #30d158;
    letter-spacing: 8px;
    margin-bottom: 30px;
  }
  .rest-circle {
    background: rgba(48, 209, 88, 0.1);
    border: 2px solid #30d158;
  }

  /* Complete Screen */
  .complete {
    padding: 30px 20px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .complete .celebration { font-size: 64px; margin-bottom: 20px; }
  .complete h1 { font-size: 32px; margin-bottom: 10px; letter-spacing: -0.5px; }
  .complete .subtitle { color: #888; margin-bottom: 30px; font-size: 16px; }
  .complete-stats {
    background: #1c1c1e;
    padding: 20px;
    border-radius: 16px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 30px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 16px;
  }
  .stat-row .label { color: #888; }
  .stat-row .value { font-weight: 600; }
  .done-btn {
    background: #0a84ff;
    color: white;
    border: none;
    padding: 16px 40px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 320px;
  }
  .hidden { display: none !important; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .timer-text.pulse {
    animation: pulse 0.5s ease-in-out infinite;
    color: #ff453a;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================================
// HOW TO INSTRUCTIONS
// ============================================================

const HOW_TO = {
  'soccer-prep': 'Follow the timer for each exercise. Do the reps within the time given, then take the built-in rest. Circuit repeats 4 times.',
  'mountain-climber': 'Do each exercise for the full time shown, focusing on form over speed. Full circuit repeats 5 times with 1 minute rest between rounds.',
  'emom-full-body': 'Every Minute On the Minute. When the minute starts, complete the reps as fast as you can, then rest until the next minute begins. Each minute you move to the next exercise. Timer runs the full 60 seconds.',
  'push-pull-cardio': 'Standard circuit. Do the reps or hold for the time shown, then move to the next exercise. Built-in rest between muscle groups. Circuit repeats 4 times.',
  'five-min-blaster': 'Cycle through the exercises for 5 minutes non-stop. Complete all exercises in the list, then tap Done to end the round and start a 60-second rest. After rest, a new round begins with a fresh 5-minute timer. If the 5-minute timer runs out before you tap Done, the round ends automatically. 5 rounds total.',
  'tabata': '20 seconds all-out effort, 10 seconds rest, 8 rounds per exercise. Then 1-minute rest and switch to the next exercise. Push maximum intensity during work intervals.',
  'bodyweight-amrap': 'A 30-minute global timer runs the whole workout. Complete all the exercises in the list, then tap Done to finish the round and start a 60-second rest. After rest, another round begins. The goal is to complete as many rounds as possible in 30 minutes.',
  'quick-15': 'Short and focused. Do the reps or hold for the time shown, then rest. Full circuit repeats 3 times.',
  'core-crusher': 'Do each exercise for the full duration shown. Rest between exercises. Full circuit repeats 3 times.',
  'push-day': 'Straight sets. Do the reps for each exercise, then take the built-in rest before the next. Complete 3 rounds of the full sequence.',
  'pull-day': 'Straight sets. Focus on controlled reps and full range of motion. Complete 3 rounds of the full sequence.',
  'legs-day': 'Straight sets. Focus on depth and form over speed. Legs get longer rest between exercises. Complete 3 rounds.',
  'rockport-test': 'A fitness test to estimate your VO2 max. Warm up 5 min, then walk exactly 1 mile as fast as possible. Note your finish time AND heart rate immediately after. Use an online Rockport calculator with your time, HR, age, weight, and sex to get your VO2 max score. Tap Skip when you complete your 1 mile.',
  'sprint-intervals': 'Alternates 30-second sprints with 90-second recovery walks for 8 rounds. During sprints, push near-maximum effort (RPE 8-9, speed 8-10 mph). During recovery, walk slowly to bring heart rate down. Excellent for VO2 max improvement and fat loss. Adjust sprint speed to your fitness level.',
  'pyramid-intervals': 'Progressive interval training that builds up in duration then comes back down (30s → 60s → 90s → 120s → 90s → 60s → 30s of hard pace, with 90s recovery between each). Teaches your body to sustain increasing effort. Great for pacing awareness and cardiovascular endurance.',
  'soccer-treadmill': 'Mimics soccer game demands with mixed sprint/jog/walk cycles. Each round: burst sprint, sustained jog, another quick sprint, then recovery walk. Repeats 6 times for match-ready fitness. Great for maintaining sport-specific cardio.',
  'posterior-chain': 'Targeted posterior chain work in 4 rounds. Each round hits glutes (KB swings, bridges), hamstrings (single-leg RDLs, reverse lunges), lower back (Superman holds), plus jump rope for cardio. Great for counteracting sitting posture, building explosive hip drive for soccer, and supporting spinal health. Use a kettlebell for swings or substitute with jump squats.',
  'rotator-cuff': 'Targets the small stabilizer muscles most people ignore: rotator cuff, rear delts, and serratus. 3 rounds of band work + bodyweight exercises. Great for shoulder health, posture, injury prevention, and supporting neck/disc health. Use a LIGHT resistance band (heavy load defeats the purpose). This is a maintenance workout — do 2-3x per week for shoulder longevity.',
  'grip-forearm': 'Grip strength is one of the strongest predictors of longevity — and it transfers to every lift you do. 3 rounds targeting grip endurance (hangs), stability (bottom-up holds), thick grip (towel), and forearms directly. Use your kettlebell or a heavy dumbbell for carries and holds. Maintenance style — do 1-2x per week.',
  'hip-mobility': 'Combines mobility drills with strength work for your hips — the joint that\'s tight in most people, weak in most people. 3 rounds of dynamic stretches and stability work. Great as a recovery day workout, a pre-lift warmup, or a standalone injury prevention session. Move slowly and control every rep.',
  'foot-ankle': 'The foundation of every athletic movement, and one of the most neglected areas. Trains your feet, calves, tibialis anterior (front of shin), and balance. Do this BAREFOOT for best results. Especially important if you have flat feet, plantar fasciitis, or ankle instability. 3 rounds, maintenance style — 1-2x per week is enough.',
  'foot-ankle-intermediate': 'Progression from the beginner version. Adds single-leg work, loaded tibialis raises, eyes-closed balance, reactive ankle hops, and jump rope. 3 rounds targeting the same areas with more challenging exercises. Do barefoot. Great for anyone who has mastered the beginner version and wants more.',
  'deep-core': 'The core you can\'t see — the one that stabilizes your spine and prevents back injury. 3 rounds focused on anti-rotation (Pallof press), stability (bird dogs, dead bugs), and endurance holds (side planks, hollow). Great for supporting heavy lifts and protecting the lower back. Use a resistance band for Pallof press or skip if you don\'t have one.',
  'metabolic-full-body': 'Similar vibe to Soccer Prep: sustained heart rate + full body strength work in 5 rounds. Combines explosive movements (KB swings, burpees) with strength (push-ups, squats) and cardio (jump rope). Great fat burner and conditioning session. Push through the rounds — the metabolic effect lasts hours after.',
  'recomp-4day': '4-day split for muscle building + fat loss using kettlebells and dumbbells. Alternates Upper/Lower with different emphases. Use STRAIGHT SETS (all sets of one exercise, then move to next). Rest FULL times between sets — this is strength training, not a circuit. Pair with cardio (Soccer Prep, Sprint Intervals) on same day or different days for full recomp effect. Aim for 3-6 workouts per week depending on recovery.',
  'recomp-push': 'Chest, shoulders, triceps. Straight sets format. Do all 4 sets of Bench Press first with full 2-minute rests, then move to Overhead Press, etc. Focus on progressive overload — try to add reps or weight each week. Use dumbbells heavy enough that last 2 reps are challenging.',

// Helper to generate straight sets (all sets of one exercise before moving on)
function makeSets(name, sets, detail, workDuration, restDuration) {
  const items = [];
  for (let i = 1; i <= sets; i++) {
    items.push({
      name,
      detail: `Set ${i} of ${sets} · ${detail}`,
      duration: workDuration,
      type: 'work',
    });
    if (i < sets) {
      items.push({ name: 'Rest', duration: restDuration, type: 'rest' });
    }
  }
  return items;
}

function getCircuitType(c) {
  if (c.treadmill) return 'treadmill';
  if (c.continuousRound || c.amrap) return 'amrap';
  return 'circuits';
}

function matchesFilters(item, isSplit = false) {
  const f = state.filters;
  const type = isSplit ? 'programs' : getCircuitType(item);
  if (f.type !== 'all' && f.type !== type) return false;
  if (f.difficulty !== 'all' && f.difficulty !== item.difficulty) return false;
  if (f.focus !== 'all' && f.focus !== item.focus) return false;
  if (f.duration !== 'all') {
    const d = item.duration || 0;
    if (f.duration === 'short' && d >= 20) return false;
    if (f.duration === 'medium' && (d < 20 || d > 30)) return false;
    if (f.duration === 'long' && d <= 30) return false;
  }
  return true;
}

function setFilter(category, value) {
  state.filters[category] = value;
  renderHome();
}

// ============================================================
// AUDIO
// ============================================================

let audioContext = null;

function playBeep(frequency = 800, duration = 0.15, volume = 0.3) {
  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.frequency.value = frequency;
    oscillator.type = 'sine';
    gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + duration);
  } catch (e) { console.log('Audio not available'); }
}

function playCountdownBeep() { playBeep(800, 0.1, 0.3); }
function playStartBeep() { playBeep(1000, 0.3, 0.4); }
function playRestBeep() { playBeep(500, 0.2, 0.3); }
function playCompleteBeep() {
  playBeep(600, 0.15, 0.4);
  setTimeout(() => playBeep(800, 0.15, 0.4), 150);
  setTimeout(() => playBeep(1000, 0.4, 0.4), 300);
}

// ============================================================
// VOICE (Text-to-Speech)
// ============================================================

let voicesLoaded = false;
let preferredVoice = null;

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (voices.length > 0) {
    // Prefer higher quality voices
    preferredVoice = voices.find(v => v.name.includes('Samantha')) ||
                     voices.find(v => v.name.includes('Karen')) ||
                     voices.find(v => v.name.includes('Daniel')) ||
                     voices.find(v => v.lang === 'en-US' && v.localService) ||
                     voices.find(v => v.lang.startsWith('en')) ||
                     voices[0];
    voicesLoaded = true;
  }
}

if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, priority = false) {
  if (!state.voiceEnabled) return;
  if (!('speechSynthesis' in window)) return;

  try {
    if (priority) speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    if (preferredVoice) utterance.voice = preferredVoice;
    utterance.rate = 1.05;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    speechSynthesis.speak(utterance);
  } catch (e) { console.log('Speech not available'); }
}

function primeSpeech() {
  // iOS requires speech to be triggered by user interaction first
  if ('speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance('');
      u.volume = 0;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
}

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// WAKE LOCK
// ============================================================

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      state.wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { console.log('Wake lock not available'); }
}

function releaseWakeLock() {
  if (state.wakeLock) {
    state.wakeLock.release().catch(() => {});
    state.wakeLock = null;
  }
}

document.addEventListener('visibilitychange', async () => {
  if (state.wakeLock !== null && document.visibilityState === 'visible' && state.screen === 'workout') {
    await requestWakeLock();
  }
});

// ============================================================
// VOICE CUE HELPERS
// ============================================================

function getRepsPhrase(exercise) {
  // Extract rep info from detail field for spoken cues
  if (!exercise.detail) return '';
  const d = exercise.detail.toLowerCase();

  // Skip pace descriptors
  if (d.includes('pace') || d.includes('all out') || d.includes('keep going')) return '';

  // For AMRAP mode with "reps" phrasing
  if (exercise.mode === 'amrap') {
    // Extract just the rep count portion
    const match = exercise.detail.match(/(\d+)\s*(reps?|total|seconds?|sec)/i);
    if (match) return `${match[1]} ${match[2]}`;
    return exercise.detail;
  }

  // Standard reps
  const match = exercise.detail.match(/(\d+)\s*reps?/i);
  if (match) return `${match[1]} reps`;
  // Total reps (e.g., "20 total")
  const totalMatch = exercise.detail.match(/(\d+)\s*total/i);
  if (totalMatch) return `${totalMatch[1]} total`;
  // Seconds (e.g., "30 seconds")
  const secMatch = exercise.detail.match(/(\d+)\s*sec/i);
  if (secMatch) return `${secMatch[1]} seconds`;
  return '';
}

function getExerciseAnnouncement(exercise, isFirst = false) {
  if (exercise.isCooldown) return 'Cool down. Easy walk to finish.';
  if (exercise.type === 'rest') {
    if (exercise.name === 'Round Rest' || exercise.name === 'Long Rest') return 'Take a rest';
    return 'Rest';
  }
  if (exercise.type === 'warmup') return 'Warming up. Get ready';

  const name = exercise.name;
  const reps = getRepsPhrase(exercise);

  // EMOM: announce reps then rest instruction
  if (state.circuit && state.circuit.emom) {
    if (isFirst) {
      return reps ? `Let's start. ${name}. ${reps}, then rest.` : `Let's start with ${name}. Rest when done.`;
    }
    return reps ? `${name}. ${reps}, then rest.` : `${name}. Rest when done.`;
  }

  // AMRAP: announce reps and tap next
  if (exercise.mode === 'amrap') {
    return reps ? `${name}. ${reps}, then tap next.` : `${name}. Do your reps then tap next.`;
  }

  // Standard timed exercise: announce with reps if available
  if (isFirst) {
    return reps ? `Let's start with ${name}. ${reps}.` : `Let's start with ${name}`;
  }
  return reps ? `${name}. ${reps}.` : name;
}

function getNextAnnouncement(exercise) {
  if (exercise.type === 'rest') {
    if (exercise.name === 'Round Rest') return 'Round rest coming up';
    return 'Rest coming up';
  }
  const reps = getRepsPhrase(exercise);
  return reps ? `Coming up: ${exercise.name}. ${reps}.` : `Coming up: ${exercise.name}`;
}

                onclick="setFilter('${category}', '${o.value}')">${o.label}</button>

  const filteredCircuits = CIRCUITS.filter(c => matchesFilters(c, false));

  app.innerHTML = `
    <div class="home">
      <div class="home-header">
        <h1>IT'S TIME TO LOCK IN</h1>
        <button class="voice-toggle ${state.voiceEnabled ? '' : 'off'}" onclick="toggleVoice()">

      <div class="filters-sticky">

        ${renderPills('type', typeOptions)}
        <div class="filter-label">Difficulty</div>
        ${renderPills('difficulty', difficultyOptions)}
        <div class="filter-label">Duration</div>
        ${renderPills('duration', durationOptions)}
        <div class="filter-label">Focus</div>
        ${renderPills('focus', focusOptions)}
      </div>
      ${totalResults === 0 ? '<div class="no-results">No workouts match your filters.</div>' : `
      <div class="circuit-grid">
        ${filteredSplits.map(s => `
          <div class="split-card" onclick="selectSplit('${s.id}')">
            <h2>${s.name}<span class="split-badge">PROGRAM</span></h2>
            <div class="meta">
              <span class="difficulty diff-${s.difficulty}">${s.difficulty}</span>
              <span class="meta-info">${s.days.length}-day split</span>
            </div>
            <div class="description">${s.description}</div>
          </div>
        `).join('')}
        ${filteredCircuits.map(c => `
          <div class="circuit-card" onclick="selectCircuit('${c.id}')">
            <h2>${c.name}${c.amrap ? '<span class="amrap-badge">AMRAP</span>' : ''}${c.continuousRound ? '<span class="amrap-badge">AMRAP</span>' : ''}${c.treadmill ? '<span class="treadmill-badge">TREADMILL</span>' : ''}</h2>
            <div class="meta">
              <span class="difficulty diff-${c.difficulty}">${c.difficulty}</span>
              <span class="meta-info">${c.duration} min${c.rounds ? ` • ${c.rounds} ${c.rounds === 1 ? 'round' : 'rounds'}` : ''}</span>
            </div>
            <div class="description">${c.description}</div>
          </div>
        `).join('')}
      </div>
      `}
    </div>
  `;
}

function selectSplit(id) {
  const split = SPLITS.find(s => s.id === id);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="split-days">
      <div class="split-days-header">
        <button class="back-btn" onclick="goHome()">‹ Back</button>
        <h1>${split.name}<span class="split-badge">PROGRAM</span></h1>
        <div class="why">${split.why}</div>
      </div>
      <div class="split-days-body">
        <h3>Choose Your Day</h3>
        <div class="day-grid">
        ${split.days.map(d => `
          <div class="day-card" onclick="selectSplitDay('${split.id}', '${d.id}')">

function selectSplitDay(splitId, dayId) {
  const split = SPLITS.find(s => s.id === splitId);
  const day = split.days.find(d => d.id === dayId);
  state.circuit = day;
  state.screen = 'preview';
  renderPreview();
}

function toggleVoice() {
  state.voiceEnabled = !state.voiceEnabled;
  localStorage.setItem('voiceEnabled', state.voiceEnabled);
  if (state.voiceEnabled) {
    primeSpeech();
    setTimeout(() => speak('Voice on', true), 100);
  } else {
    speechSynthesis.cancel();
  }
  renderHome();
}

function selectCircuit(id) {
  state.circuit = CIRCUITS.find(c => c.id === id);
  state.screen = 'preview';
  renderPreview();
}

function renderPreview() {
  const c = state.circuit;
  const app = document.getElementById('app');

  const exercisesToShow = c.continuousRound ? c.workExercises : c.exercises;
  const structureLabel = c.continuousRound ? 'Exercises Per Round' : 'Round Structure';

  const roundsDisplay = c.rounds
    ? `🔁 ${c.rounds} ${c.rounds === 1 ? 'round' : 'rounds'}`
    : `🔁 Self-paced`;

  app.innerHTML = `
    <div class="preview">
      <div class="preview-header">
        <button class="back-btn" onclick="goHome()">‹ Back</button>
        <h1>${c.name}${c.amrap ? '<span class="amrap-badge">AMRAP</span>' : ''}${c.continuousRound ? '<span class="amrap-badge">AMRAP</span>' : ''}${c.treadmill ? '<span class="treadmill-badge">TREADMILL</span>' : ''}</h1>
        <div class="stats">
          <span>⏱ ${c.duration} min</span>
          <span>${roundsDisplay}</span>
          <span>💪 ${c.difficulty}</span>
        </div>
        <button class="start-btn-top" onclick="startWorkout()">Start Workout</button>
      </div>
      <div class="preview-body">
        <div class="description">${c.description}</div>
        <div class="how-to">
          <h3>How To</h3>
          <p>${getHowTo(c.id)}</p>
        </div>
        <div class="exercise-list">
          <h3>${structureLabel}</h3>
          ${exercisesToShow.map(ex => `
            <div class="exercise-item">
              <div>${ex.name}${ex.detail ? ` <span style="color:#888;font-size:13px">• ${ex.detail}</span>` : ''}</div>
              <div class="duration">${ex.mode === 'amrap' ? 'Tap Next' : (c.continuousRound ? '—' : ex.duration + 's')}</div>
            </div>
          `).join('')}
          ${c.continuousRound ? `
            <div class="exercise-item" style="opacity:0.7">
              <div>Round Rest</div>
              <div class="duration">${c.roundRest.duration}s</div>
            </div>
          ` : ''}
          ${c.cooldown && !c.continuousRound ? `
            <div class="exercise-item" style="opacity:0.7">
              <div>${c.cooldown.name}${c.cooldown.detail ? ` <span style="color:#888;font-size:13px">• ${c.cooldown.detail}</span>` : ''}</div>
              <div class="duration">${c.cooldown.duration}s</div>
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

function goHome() {
  stopTimer();
  releaseWakeLock();
  speechSynthesis.cancel();
  state.screen = 'home';
  state.circuit = null;
  renderHome();
}

// ============================================================
// WORKOUT
// ============================================================

function startWorkout() {
  playBeep(1, 0.01, 0);
  primeSpeech();
  requestWakeLock();

  const c = state.circuit;
  state.exercises = [];
  state.completedRounds = 0;
  state.currentRound = 1;
  state.isPaused = false;
  state.workoutStartTime = Date.now();
  state.screen = 'workout';
  state.spokenCues = new Set();

  if (c.continuousRound) {
    // New continuous round flow: warmup, then round/rest cycles managed by phase
    state.phase = 'warmup';
    if (c.totalDuration) state.workoutTimeRemaining = c.totalDuration;
    if (c.roundDuration) state.roundTimeRemaining = c.roundDuration;

    if (c.warmup) {
      state.timeRemaining = c.warmup.duration;
      state.totalTimeRemaining = c.warmup.duration + (c.totalDuration || (c.roundDuration * c.rounds));
    } else {
      // Skip straight to round
      state.timeRemaining = c.roundDuration || c.totalDuration;
      state.totalTimeRemaining = c.totalDuration || (c.roundDuration * c.rounds);
      state.phase = 'round';
    }

    renderWorkout();
    startTimer();
    playStartBeep();

    setTimeout(() => {
      if (state.phase === 'warmup') {
        speak(`Let's warm up. Get ready.`, true);
      } else {
        speak(`Round 1, go!`, true);
      }
    }, 400);
    return;
  }

  // Standard mode
  state.phase = 'standard';
  if (c.warmup) {
    state.exercises.push({ ...c.warmup, round: 0, isWarmup: true });
  }
  for (let r = 1; r <= c.rounds; r++) {
    c.exercises.forEach(ex => {
      state.exercises.push({ ...ex, round: r });
    });
  }
  if (c.cooldown) {
    state.exercises.push({ ...c.cooldown, round: 0, isCooldown: true });
  }

  state.currentExerciseIndex = 0;
  state.timeRemaining = state.exercises[0].duration;
  state.totalTimeRemaining = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);

  renderWorkout();
  startTimer();
  playStartBeep();

  const firstEx = state.exercises[0];
  setTimeout(() => {
    speak(getExerciseAnnouncement(firstEx, true), true);
  }, 400);
}

function startRound() {
  const c = state.circuit;
  state.phase = 'round';
  state.spokenCues = new Set();
  if (c.roundDuration) {
    state.roundTimeRemaining = c.roundDuration;
    state.timeRemaining = c.roundDuration;
  } else if (c.totalDuration) {
    state.timeRemaining = state.workoutTimeRemaining;
  }
  playStartBeep();
  vibrate([200]);
  renderWorkout();

  const roundText = c.rounds && state.currentRound === c.rounds
    ? 'Final round, go!'
    : `Round ${state.currentRound}, go!`;
  setTimeout(() => speak(roundText, true), 300);
}

function completeRound() {
  const c = state.circuit;
  state.completedRounds++;

  // 5-Min Blaster: check if all rounds done
  if (c.rounds && state.completedRounds >= c.rounds) {
    completeWorkout();
    return;
  }

  // Start rest
  startRest();
}

function startRest() {
  const c = state.circuit;
  state.phase = 'rest';
  state.restTimeRemaining = c.roundRest.duration;
  state.timeRemaining = c.roundRest.duration;
  state.spokenCues = new Set();
  playRestBeep();
  vibrate([100, 50, 100]);
  renderWorkout();
  setTimeout(() => speak(`Round ${state.completedRounds} done. Take a rest.`, true), 300);
}

function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (state.isPaused) return;

    // Continuous round handling
    if (state.circuit && state.circuit.continuousRound) {
      tickContinuousRound();
      return;
    }

    // Standard workout tick
    state.timeRemaining--;
    state.totalTimeRemaining--;

    checkVoiceCues();

    if (state.timeRemaining <= 5 && state.timeRemaining > 0) {
      playCountdownBeep();
    }

    if (state.timeRemaining <= 0) {
      nextExercise();
    } else {
      updateTimerDisplay();
    }
  }, 1000);
}

function tickContinuousRound() {
  const c = state.circuit;

  if (state.phase === 'warmup') {
    state.timeRemaining--;
    state.totalTimeRemaining--;
    if (state.timeRemaining <= 5 && state.timeRemaining > 0) {
      playCountdownBeep();
    }
    updateTimerDisplay();
    if (state.timeRemaining <= 0) {
      startRound();
    }
    return;
  }

  if (state.phase === 'round') {
    state.totalTimeRemaining--;
    if (c.totalDuration) {
      state.workoutTimeRemaining--;
      state.timeRemaining = state.workoutTimeRemaining;
      if (state.workoutTimeRemaining <= 0) {
        completeWorkout();
        return;
      }
    } else if (c.roundDuration) {
      state.roundTimeRemaining--;
      state.timeRemaining = state.roundTimeRemaining;
      if (state.roundTimeRemaining <= 0) {
        // Auto end round when timer runs out
        completeRound();
        return;
      }
    }
    updateTimerDisplay();
    return;
  }

  if (state.phase === 'rest') {
    state.restTimeRemaining--;
    state.timeRemaining = state.restTimeRemaining;
    state.totalTimeRemaining--;

    // For BW AMRAP, workout timer keeps counting during rest
    if (c.totalDuration) {
      state.workoutTimeRemaining--;
    }

    // Countdown beeps + voice for last 5 seconds
    if (state.restTimeRemaining >= 1 && state.restTimeRemaining <= 5) {
      if (!state.spokenCues.has('rest' + state.restTimeRemaining)) {
        playCountdownBeep();
        speak(String(state.restTimeRemaining));
        state.spokenCues.add('rest' + state.restTimeRemaining);
      }
    }

    updateTimerDisplay();

    // Check if workout timer ran out during rest (BW AMRAP)
    if (c.totalDuration && state.workoutTimeRemaining <= 0) {
      completeWorkout();
      return;
    }

    if (state.restTimeRemaining <= 0) {
      state.currentRound++;
      startRound();
    }
  }
}

function checkVoiceCues() {
  const currentEx = state.exercises[state.currentExerciseIndex];
  const nextEx = state.exercises[state.currentExerciseIndex + 1];

  // 10 seconds before end: announce next exercise (skip if AMRAP - user controls transition)
  if (state.timeRemaining === 10 && nextEx && !state.spokenCues.has('next10') && currentEx.mode !== 'amrap') {
    speak(getNextAnnouncement(nextEx));
    state.spokenCues.add('next10');
  }

  // Countdown from 5
  if (state.timeRemaining >= 1 && state.timeRemaining <= 5 && !state.spokenCues.has('count' + state.timeRemaining)) {
    speak(String(state.timeRemaining));
    state.spokenCues.add('count' + state.timeRemaining);
  }
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function nextExercise() {
  state.currentExerciseIndex++;
  state.spokenCues = new Set();

  if (state.currentExerciseIndex >= state.exercises.length) {
    completeWorkout();
    return;
  }

  const nextEx = state.exercises[state.currentExerciseIndex];
  const previousRound = state.currentRound;
  state.currentRound = nextEx.round || state.currentRound;
  state.timeRemaining = nextEx.duration;

  const isNewRound = nextEx.round && nextEx.round > previousRound && nextEx.round > 0;

  if (nextEx.type === 'rest') {
    playRestBeep();
    vibrate([100, 50, 100]);
  } else {
    playStartBeep();
    vibrate([200]);
  }

  renderWorkout();

  // Voice announcements
  setTimeout(() => {
    if (isNewRound && nextEx.type !== 'rest') {
      const roundText = nextEx.round === state.circuit.rounds ? 'Final round' : `Round ${nextEx.round}`;
      speak(roundText, true);
      setTimeout(() => speak(getExerciseAnnouncement(nextEx)), 900);
    } else {
      speak(getExerciseAnnouncement(nextEx), true);
    }
  }, 300);
}

function togglePause() {
  state.isPaused = !state.isPaused;
  if (state.isPaused) {
    speak('Paused', true);
  } else {
    speak('Resuming', true);
  }
  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.textContent = state.isPaused ? 'Resume' : 'Pause';
}

function skipExercise() {
  // For continuous rounds, skip warmup goes to first round
  if (state.circuit && state.circuit.continuousRound && state.phase === 'warmup') {
    startRound();
    return;
  }
  nextExercise();
}

function handleDone() {
  // User tapped Done to end the current round
  if (state.phase === 'round') {
    completeRound();
  }
}

function quitWorkout() {
  if (confirm('End workout?')) {
    stopTimer();
    releaseWakeLock();
    speechSynthesis.cancel();
    goHome();
  }
}

function renderWorkout() {
  const c = state.circuit;

  // Continuous round dedicated renderer
  if (c.continuousRound) {
    renderContinuousRoundWorkout();
    return;
  }

  const currentEx = state.exercises[state.currentExerciseIndex];
  const nextEx = state.exercises[state.currentExerciseIndex + 1];

  const totalDuration = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);
  const progress = ((totalDuration - state.totalTimeRemaining) / totalDuration) * 100;

  const roundText = currentEx.isWarmup ? 'Warm-Up' : currentEx.isCooldown ? 'Cool-Down' : `Round ${state.currentRound} of ${c.rounds}`;
  const timerClass = currentEx.type === 'rest' ? 'rest' : currentEx.type === 'warmup' ? 'warmup' : 'work';

  const displayEx = currentEx;
  const isAmrap = currentEx.mode === 'amrap';
  const showNextButton = isAmrap;

  const nextDisplayName = nextEx ? nextEx.name : null;

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="workout">
      <div class="workout-header">
        <div class="round-info">${roundText}</div>
        <button class="quit-btn" onclick="quitWorkout()">End</button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${progress}%"></div>
      </div>
      <div class="exercise-name">${displayEx.name}</div>
      <div class="exercise-type">${displayEx.detail || displayEx.type}</div>
      ${isAmrap ? '<div class="amrap-hint">Do reps then tap Next</div>' : ''}
      <div class="timer-container">
        <div class="timer-circle">
          <div class="timer-text ${timerClass}" id="timerText">${formatTime(state.timeRemaining)}</div>
        </div>
        ${nextDisplayName ? `<div class="next-up">Next: <span>${nextDisplayName}</span></div>` : ''}
      </div>
      <div class="workout-controls">
        <button class="control-btn" id="pauseBtn" onclick="togglePause()">${state.isPaused ? 'Resume' : 'Pause'}</button>
        <button class="control-btn primary" onclick="skipExercise()">Skip</button>
      </div>
    </div>
  `;
}

function renderContinuousRoundWorkout() {
  const c = state.circuit;
  const app = document.getElementById('app');

  // Calculate progress based on time
  const totalDuration = c.totalDuration || (c.roundDuration * c.rounds + (c.roundRest.duration * (c.rounds - 1)));
  const progress = ((totalDuration - state.totalTimeRemaining) / totalDuration) * 100;

  // Round display text
  let roundText;
  if (state.phase === 'warmup') {
    roundText = 'Warm-Up';
  } else if (c.rounds) {
    roundText = `Round ${state.currentRound} of ${c.rounds}`;
  } else {
    roundText = `Round ${state.currentRound}`;
  }

  // Rest phase
  if (state.phase === 'rest') {
    const showGlobal = c.totalDuration;
    app.innerHTML = `
      <div class="workout continuous-rest">
        <div class="workout-header">
          <div class="round-info">Round ${state.completedRounds} done</div>
          <button class="quit-btn" onclick="quitWorkout()">End</button>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${progress}%"></div>
        </div>
        ${showGlobal ? `
          <div class="global-timer-strip">
            <div class="global-timer-label">Workout Time Left</div>
            <div class="global-timer-value" id="globalTimer">${formatTime(state.workoutTimeRemaining)}</div>
          </div>
        ` : ''}
        <div class="rest-container">
          <div class="rest-label">REST</div>
          <div class="timer-circle rest-circle">
            <div class="timer-text rest" id="timerText">${formatTime(state.timeRemaining)}</div>
          </div>
          <div class="next-up">Next: <span>Round ${state.currentRound + 1}</span></div>
        </div>
        <div class="workout-controls">
          <button class="control-btn" id="pauseBtn" onclick="togglePause()">${state.isPaused ? 'Resume' : 'Pause'}</button>
          <button class="control-btn primary" onclick="skipRest()">Skip Rest</button>
        </div>
      </div>
    `;
    return;
  }

  // Warmup phase
  if (state.phase === 'warmup') {
    app.innerHTML = `
      <div class="workout">
        <div class="workout-header">
          <div class="round-info">${roundText}</div>
          <button class="quit-btn" onclick="quitWorkout()">End</button>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${progress}%"></div>
        </div>
        <div class="exercise-name">Warm-Up</div>
        <div class="exercise-type">Get Ready</div>
        <div class="timer-container">
          <div class="timer-circle">
            <div class="timer-text warmup" id="timerText">${formatTime(state.timeRemaining)}</div>
          </div>
        </div>
        <div class="workout-controls">
          <button class="control-btn" id="pauseBtn" onclick="togglePause()">${state.isPaused ? 'Resume' : 'Pause'}</button>
          <button class="control-btn primary" onclick="skipExercise()">Skip</button>
        </div>
      </div>
    `;
    return;
  }

  // Round phase - show all exercises + Done button
  const timerLabel = c.totalDuration ? 'Time Left' : 'Round Time';

  app.innerHTML = `
    <div class="workout continuous-round">
      <div class="workout-header">
        <div class="round-info">${roundText}</div>
        <button class="quit-btn" onclick="quitWorkout()">End</button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${progress}%"></div>
      </div>
      <div class="round-timer-block">
        <div class="round-timer-label">${timerLabel}</div>
        <div class="round-timer" id="timerText">${formatTime(state.timeRemaining)}</div>
      </div>
      <div class="round-exercise-list">
        ${c.workExercises.map((ex, i) => `
          <div class="round-exercise">
            <div class="round-ex-number">${i + 1}</div>
            <div class="round-ex-content">
              <div class="round-ex-name">${ex.name}</div>
              ${ex.detail ? `<div class="round-ex-detail">${ex.detail}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
      <div class="workout-controls">
        <button class="control-btn" id="pauseBtn" onclick="togglePause()">${state.isPaused ? 'Resume' : 'Pause'}</button>
        <button class="control-btn done-btn" onclick="handleDone()">Done ✓</button>
      </div>
    </div>
  `;
}

function skipRest() {
  if (state.phase !== 'rest') return;
  state.restTimeRemaining = 0;
  state.currentRound++;
  startRound();
}

function updateTimerDisplay() {
  const timerText = document.getElementById('timerText');
  if (timerText) {
    timerText.textContent = formatTime(state.timeRemaining);
    if (state.timeRemaining <= 5 && state.timeRemaining > 0) timerText.classList.add('pulse');
    else timerText.classList.remove('pulse');
  }
  // Update global timer if present (rest phase in BW AMRAP)
  const globalTimer = document.getElementById('globalTimer');
  if (globalTimer && state.circuit && state.circuit.totalDuration) {
    globalTimer.textContent = formatTime(state.workoutTimeRemaining);
  }
  const c = state.circuit;
  let totalDuration;
  if (c && c.continuousRound) {
    totalDuration = c.totalDuration || (c.roundDuration * c.rounds + (c.roundRest.duration * (c.rounds - 1)));
    if (c.warmup) totalDuration += c.warmup.duration;
  } else {
    totalDuration = state.exercises.reduce((sum, ex) => sum + ex.duration, 0);
  }
  const progress = ((totalDuration - state.totalTimeRemaining) / totalDuration) * 100;
  const progressFill = document.querySelector('.progress-fill');
  if (progressFill) progressFill.style.width = progress + '%';
}

function formatTime(seconds) {
  if (seconds >= 60) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }
  return seconds.toString();
}

function completeWorkout() {
  stopTimer();
  releaseWakeLock();
  playCompleteBeep();
  vibrate([200, 100, 200, 100, 200]);
  speak('Workout complete. Great job!', true);

  const duration = Math.round((Date.now() - state.workoutStartTime) / 1000);
  const minutes = Math.floor(duration / 60);
  const seconds = duration % 60;

  const c = state.circuit;
  const isContinuous = c.continuousRound;
  const roundsDisplay = isContinuous
    ? (c.rounds ? `${state.completedRounds} / ${c.rounds}` : `${state.completedRounds}`)
    : `${c.rounds} / ${c.rounds}`;

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="complete">
      <div class="celebration">🎉</div>
      <h1>Workout Complete!</h1>
      <div class="subtitle">${c.name}</div>
      <div class="complete-stats">
        <div class="stat-row">
          <span class="label">Duration</span>
          <span class="value">${minutes}:${seconds.toString().padStart(2, '0')}</span>
        </div>
        <div class="stat-row">
          <span class="label">Rounds ${isContinuous && !c.rounds ? 'Completed' : ''}</span>
          <span class="value">${roundsDisplay}</span>
        </div>
        <div class="stat-row">
          <span class="label">Difficulty</span>
          <span class="value" style="text-transform:capitalize">${c.difficulty}</span>
        </div>
      </div>
      <button class="done-btn" onclick="goHome()">Done</button>
    </div>
  `;
  state.screen = 'complete';
}

// ============================================================
// INIT
// ============================================================

renderHome();

window.addEventListener('beforeunload', (e) => {
  if (state.screen === 'workout') {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
</html>
